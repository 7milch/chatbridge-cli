name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The `check` status is required by the main ruleset, so the workflow
      # must always run and report. Docs-only changes (docs/**, *.md) skip the
      # heavy steps below and still report success.
      - id: changes
        name: Detect code changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base...HEAD" | grep -Ev '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only change; skipping build and tests."
          fi
      - if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - if: steps.changes.outputs.code == 'true'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.code == 'true'
        run: ./packages/runtime/node_modules/.bin/playwright install --with-deps chromium
      - if: steps.changes.outputs.code == 'true'
        run: bun run check
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.changes.outputs.code == 'true'
        run: node packages/cli/dist/bin.js --help
      - if: steps.changes.outputs.code == 'true'
        run: scripts/pack-all.sh packs
