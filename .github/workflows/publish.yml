name: Publish
on:
  push:
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11 # Trusted Publishing needs npm >= 11.5
      - run: bun install --frozen-lockfile
      - run: ./packages/runtime/node_modules/.bin/playwright install --with-deps chromium
      - run: bun run check
      - run: scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
      - run: scripts/pack-all.sh packs
      - name: Publish in dependency order
        run: |
          set -euo pipefail
          for name in chatbridge-provider chatbridge-runtime chatbridge-core chatbridge-cli chatbridge-vscode; do
            # "<name>-<digit>..." so "chatbridge-" does not match "chatbridge-core-".
            tgz=$(ls packs/${name}-[0-9]*.tgz) # published as "./$tgz": a bare "packs/x.tgz" is parsed by npm as a GitHub owner/repo shorthand
            # Idempotent across a partial failure: skip anything already on
            # the registry, so a re-run of the tag resumes where it stopped.
            manifest=$(tar -xOf "$tgz" package/package.json)
            pkg=$(printf '%s' "$manifest" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);process.stdout.write(m.name+"@"+m.version)})')
            if npm view "$pkg" version >/dev/null 2>&1; then
              echo "$pkg already published; skipping"
              continue
            fi
            npm publish "./$tgz" --provenance --access public
          done

  # Separate job so the publish job keeps `contents: read`.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes are generated from the previous tag
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Idempotent: a re-run of the tag must not fail on an existing release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          # A tag like v0.9.0-rc.1 is a prerelease.
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          # Notes span the previous tag to this one. Empty on the first release,
          # where GitHub falls back to the whole history.
          start=()
          previous=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG}$" | head -1 || true)
          if [ -n "$previous" ]; then
            start=(--notes-start-tag "$previous")
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            "${start[@]+"${start[@]}"}" \
            "${prerelease[@]+"${prerelease[@]}"}"
